<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi Sandbox VR - Quest 3S</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/super-hands@3.0.4/dist/super-hands.min.js"></script>
  </head>
  <body>
    <a-scene physics="gravity: -9.8; debug: false">
      <a-sky color="#1a1a2e"></a-sky>
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" position="2 4 3" intensity="0.8"></a-light>
      <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#2d3436" static-body></a-plane>
      <a-box position="0 0.5 -1.2" width="2" height="1" depth="1" color="#636e72" static-body></a-box>
      <a-box position="-0.4 1.3 -1.2" width="0.25" height="0.25" depth="0.25" color="#ff7675" dynamic-body="mass: 1" grabbable stretchable draggable></a-box>
      <a-box position="0 1.3 -1.2" width="0.25" height="0.25" depth="0.25" color="#74b9ff" dynamic-body="mass: 1" grabbable stretchable draggable></a-box>
      <a-box position="0.4 1.3 -1.2" width="0.25" height="0.25" depth="0.25" color="#55efc4" dynamic-body="mass: 1" grabbable stretchable draggable></a-box>
      <a-sphere position="0 1.8 -1.2" radius="0.15" color="#ffeaa7" dynamic-body="mass: 0.5; restitution: 0.8" grabbable draggable></a-sphere>

      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity sphere-collider="objects: [grabbable]" super-hands hand-controls="hand: left; handModelStyle: lowPoly; color: #dfe6e9"></a-entity>
        <a-entity sphere-collider="objects: [grabbable]" super-hands hand-controls="hand: right; handModelStyle: lowPoly; color: #dfe6e9"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
